services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?set in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set in .env}
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 12

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mongo: { condition: service_healthy }
    environment:
      APP_ENV: ${APP_ENV:-production}
      MONGO_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SEED_DEMO: ${SEED_DEMO:-false}
      PLANT_TIMEZONE: ${PLANT_TIMEZONE:-Asia/Kuala_Lumpur}

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on: [backend]
    ports: ["${WEB_PORT:-8080}:80"]

volumes:
  mongo-data:
